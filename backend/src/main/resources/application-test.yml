spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-unit-tests-must-be-long-enough-for-hmac-sha
  expiration: 86400000

app:
  notification-radius-km: 10.0
  max-upload-size-mb: 5

firebase:
  credentials-path:

google:
  maps:
    api-key:

logging:
  level:
    root: WARN
    com.foodconnect: DEBUG
